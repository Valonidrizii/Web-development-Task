  <head>

    <link rel="stylesheet" href="style 06.css" />
  </head>

  <body>

      <a class="logo" href="#home">Valon</a>

      <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>

    </header>

    <main>
      <section id="home">

        <p>I am learning HTML, CSS and JavaScript.</p>
      </section>

      <section id="about">
        <h2>About</h2>
        <p>I enjoy building websites and learning new skills.</p>
      </section>

      <section id="services">
        <h2>Services</h2>
        <p>I create simple and responsive web pages.</p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <a href="mailto:valon@example.com">valon@example.com</a>
      </section>
    </main>
  </body>
</html>
