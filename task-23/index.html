    <p class="task-label">Detyra 23 · HTML / CSS / JavaScript</p>
    <h1>Formulari i dërgesës</h1>
    <p class="description">Plotëso të dhënat e dërgesës. Ky është vetëm një formular demonstrues.</p>
    
<form id="delivery-form">
<div class="two-cols"><div><label for="name">Emri dhe mbiemri</label><input id="name" name="name" autocomplete="name" required></div><div><label for="address">Adresa</label><input id="address" name="address" autocomplete="street-address" required></div><div><label for="city">Qyteti</label><input id="city" name="city" autocomplete="address-level2" required></div><div><label for="postal">Kodi postar</label><input id="postal" name="postal" autocomplete="postal-code" required></div></div>
<fieldset><legend>Mënyra e dërgesës</legend><label class="choice"><input type="radio" name="delivery" value="standard" checked> Standard · 3–5 ditë</label><label class="choice"><input type="radio" name="delivery" value="express"> Ekspres · 1–2 ditë</label></fieldset>
<div><label for="notes">Shënime për dërgesën (opsionale)</label><textarea id="notes" name="notes" placeholder="P.sh. më telefono kur të arrish."></textarea></div><button type="submit">Kontrollo formularin</button><p id="message" role="status"></p></form>
  </main>
